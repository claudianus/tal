<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탈</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="stage" class="pov-yunjae">
  <canvas id="bg"></canvas>
  <canvas id="world"></canvas>
  <div id="tint"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="ghosts" aria-hidden="true"></div>
  <div id="bars" aria-hidden="true"><i></i><i></i></div>

  <div id="col" data-skin="none">
    <div id="dev-head"></div>
    <div id="flow"><div class="spacer"></div></div>
    <div id="choices"></div>
  </div>

  <div id="pics"></div>
  <div id="hint"></div>
  <div id="winchoices"></div>
  <div id="win" data-kind="narr"><div id="win-name"></div><div id="win-body"></div><div id="win-more" aria-hidden="true">▾</div></div>

  <div id="hud">
    <div id="hud-tr"><div id="clock"></div><div id="views"></div></div>
    <div id="hud-bl">
      <div class="gauge" id="g-energy"><span>기력</span><b></b></div>
      <div class="gauge" id="g-heat"><span>더위</span><i><u></u></i></div>
      <div class="gauge" id="g-gaze"><span>시선</span><i><u></u></i></div>
    </div>
    <div id="who"></div>
  </div>

  <button id="menu-btn" aria-label="메뉴">≡</button>
  <div id="pad" aria-hidden="true">
    <button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="right">▶</button><button data-dir="down">▼</button>
  </div>
  <button id="pad-z" aria-hidden="true">Z</button>
  <div id="deck" aria-hidden="true"></div><div id="winres" aria-hidden="true"></div>
  <div id="card"></div>

  <div id="pausemenu" hidden>
    <div class="panel">
      <button data-act="resume">계속하기</button>
      <button data-act="mute">소리: 보통</button>
      <button data-act="warn" class="toggle">장면 경고 켜기</button>
      <button data-act="title">처음 화면으로</button>
    </div>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>탈</h1>
      <p class="sub">고양이 탈을 쓰지 않으면 방 밖에 나갈 수 없는 나는</p>
      <div class="btns" id="menu-btns"></div>
      <p class="note">방향키로 걷고, Z나 스페이스로 조사하고 넘깁니다 · 헤드폰을 권합니다</p>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
